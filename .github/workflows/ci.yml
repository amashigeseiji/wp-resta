name: ci

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests:  write

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - uses: reviewdog/action-setup@v1
      with:
        reviewdog_version: latest

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Check PSR-4 mapping
      run: composer dump-autoload --dev --optimize --strict-psr

    # PR へのインラインコメント用。失敗の判定は次のステップで行う
    # 解析は phpstan.neon の設定で全体に対して行い、差分への絞り込みは reviewdog に任せる
    - name: Comment phpstan errors on the pull request
      env:
        REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: vendor/bin/phpstan analyse --memory-limit=-1 --error-format=raw --no-progress | reviewdog -reporter=github-pr-review -f=phpstan -fail-on-error=false

    # 手元の composer lint と同じもの。指摘があれば CI を落とす
    - name: Run phpstan analyse
      run: composer lint

    - name: Run test suite
      run: composer run-script test

  e2e:

    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # 最新と、spec.md「互換性ポリシー」の下限
        wp-image:
          - wordpress:php8.2-apache
          - wordpress:6.1-php8.2-apache

    name: e2e (${{ matrix.wp-image }})

    env:
      WP_IMAGE: ${{ matrix.wp-image }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Start WordPress
      run: ./docker/setup.sh

    - name: Show WordPress version
      run: docker compose exec -T wpcli wp core version

    - name: Run E2E tests
      run: composer test:e2e

    - name: Show WordPress logs
      if: failure()
      run: docker compose logs --tail=200 wordpress
